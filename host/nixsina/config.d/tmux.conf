# see https://stackoverflow.com/a/17545247
unbind-key C-b
set-option -g prefix `
bind-key ` send-prefix

set-option -g default-terminal "xterm-256color"
set -a terminal-features "xterm-256color:RGB"

# bar
set-option -g status-position "top"
set-option -g -g status-style "bg=default"
set-option -g status-justify "absolute-centre"
set-option -g window-status-current-style "fg=black bg=white"
set-option -g status-right ""
set-option -g status-left "#S::#{b:pane_current_path}"
set-option -g status-right-length 0
set-option -g status-left-length 100

# keep BEL ring when its current shell
set-option  -g bell-action any
set-option  -g visual-bell off
set-window-option -g monitor-bell on

# set window index starting with 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows "on"

set-option -s escape-time 0

set-option -g history-limit 5000
set -g mode-style "reverse"
# tmux defaults to vi when $EDITOR contains "vi"; the copy-mode bindings below target the emacs table
set-window-option -g mode-keys emacs
set-option -g focus-events on

# see https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# natural mouse select
# see https://github.com/tmux/tmux/issues/140#issuecomment-474341833
set-option -g mouse on
unbind-key -T copy-mode MouseDragEnd1Pane
bind-key -T copy-mode MouseDown1Pane select-pane\; send-keys -X clear-selection
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= \"#{pane_in_mode}\" \"copy-mode -eM\" \"send-keys -M\"' 'copy-mode -eM'

bind r source-file "~/.config/tmux/tmux.conf"
# see https://unix.stackexchange.com/a/30283
bind-key & kill-window
bind-key x kill-pane
# split & set cwd to that cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind N new-window -c "#{pane_current_path}"
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "wl-copy"
bind G new-window -c "#{pane_current_path}" -e SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/ssh-agent -S "direnv exec . lazygit"
# see https://stackoverflow.com/a/46577101
bind -Tcopy-mode WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode WheelDownPane send -N1 -X scroll-down
bind g run open-github
# open the pull request page of the current branch, or the create-PR page when none exists yet
bind P run -b "cd '#{pane_current_path}' && export BROWSER=xdg-open; gh pr view --web || gh pr create --web"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v new-window -b -c "#{pane_current_path}" "nvim"
# unzoom so every pane number is visible, keep the numbers up until a pane number is pressed, then zoom into it
# display-panes closes on any key, so -N leaves keys to the pane-pick table instead; Escape cancels
# a fresh 1ms display-panes replaces the indefinite one, which is how the overlay gets closed
bind q {
  if -F '#{window_zoomed_flag}' { resize-pane -Z }
  display-panes -N -b -d 0
  switch-client -T pane-pick
}
bind -T pane-pick Any switch-client -T pane-pick
bind -T pane-pick Escape display-panes -N -b -d 1
bind -T pane-pick 1 { if -F '#{e|<=:1,#{window_panes}}' { select-pane -t :.1; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 2 { if -F '#{e|<=:2,#{window_panes}}' { select-pane -t :.2; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 3 { if -F '#{e|<=:3,#{window_panes}}' { select-pane -t :.3; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 4 { if -F '#{e|<=:4,#{window_panes}}' { select-pane -t :.4; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 5 { if -F '#{e|<=:5,#{window_panes}}' { select-pane -t :.5; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 6 { if -F '#{e|<=:6,#{window_panes}}' { select-pane -t :.6; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 7 { if -F '#{e|<=:7,#{window_panes}}' { select-pane -t :.7; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 8 { if -F '#{e|<=:8,#{window_panes}}' { select-pane -t :.8; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
bind -T pane-pick 9 { if -F '#{e|<=:9,#{window_panes}}' { select-pane -t :.9; resize-pane -Z; display-panes -N -b -d 1 } { switch-client -T pane-pick } }
# see https://stackoverflow.com/a/63854302
bind s choose-tree -sZ -O name
